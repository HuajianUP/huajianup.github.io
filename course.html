<!DOCTYPE html>
<html lang="en">
<title>Huajian homepage</title>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="assets/css/w3.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Raleway">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" type="text/css" href="assets/css/main.css">

<!--<style> Moved to main.css-->
<!--body,h1,h2,h3,h4,h5,h6 {font-family: "Titillium Web", sans-serif}-->
<!--</style>-->

<body class="hj-white w3-content" style="max-width:1300px">

<script type="application/javascript">
var doNotTrack = false;
if (!doNotTrack) {
  (function(i,s,o,g,r,a,m){i['GoogleAnalyticsObject']=r;i[r]=i[r]||function(){
  (i[r].q=i[r].q||[]).push(arguments)},i[r].l=1*new Date();a=s.createElement(o),
  m=s.getElementsByTagName(o)[0];a.async=1;a.src=g;m.parentNode.insertBefore(a,m)
  })(window,document,'script','https://www.google-analytics.com/analytics.js','ga');
  ga('create', 'UA-178921838-1', 'auto');
  ga('send', 'pageview');
}
</script>


<!-- Sidebar/menu -->
<nav class="w3-sidebar w3-collapse hj-white" style="z-index:3;width:300px;" id="mySidebar">
</nav>

<!-- Overlay effect when opening sidebar on small screens -->
<div class="w3-overlay w3-hide-large w3-animate-opacity" onclick="w3_close()" style="cursor:pointer" title="close side menu" id="myOverlay"></div>

<!-- !PAGE CONTENT! -->
<div class="w3-main" style="margin-left:300px">

  <!-- Header -->
  <header id="about">
    <img src="thumbnails/profile.jpg" style="width:95px;" class="w3-circle w3-right w3-margin w3-hide-large">
    <span class="w3-button w3-hide-large w3-xxlarge w3-hover-text-grey" onclick="w3_open()"><i class="fa fa-bars"></i></span>
  </header>

  <div class="w3-container w3-padding-large w3-card" style="margin-left:10px" id="publications">
    <h2>Courses</h2>
    <table class="w3-table pub ">

      <tr>
        <td class="tn-td w3-padding paper-container">
          <div class="img-resize"> <img src="thumbnails/3D-SI.jpg" class="tn-img" alt="" /> </div>
          <div class="info-resize">
            <div style="padding: 1px; margin-top: auto" class="title">三维感知与空间智能</div>
            <!-- <div class="author"><span class="me">Huajian Huang</span></div> -->
            <div class="journal">
              <!-- <span class="journal-title"></span>, -->
              <span class="journal-year">2026</span>
            </div>
            <div class="link">
              <a class="btn btn-primary outline" href="course/3dvision" target="_blank">Course Page</a>
            </div>
          </div>
        </td>
      </tr>


    </table>
  </div>


<!-- End page content -->
</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
  fetch("sidebar.html")
    .then(response => response.text())
    .then(data => {
      document.getElementById("mySidebar").innerHTML = data;
    })
    .catch(error => console.error("Error loading sidebar:", error));
});
// Script to open and close sidebar
function w3_open() {
    document.getElementById("mySidebar").style.display = "block";
    document.getElementById("myOverlay").style.display = "block";
}

function w3_close() {
    document.getElementById("mySidebar").style.display = "none";
    document.getElementById("myOverlay").style.display = "none";
}
</script>

</body>
</html>
